## Per-plugin isolation override for the elgg3 migration test environment.
##
## Each plugin is migrated and verified in isolation. This file never bakes in
## absolute developer paths — it reads them from `.env` (gitignored) so the
## environment is portable across machines.
##
## Required variables (set in docker/elgg3/.env or the shell):
##   PLUGINS_DIR   Absolute path to the directory containing plugin sources.
##   PLUGIN_ID     Id of the plugin under test. This is used as both the
##                 directory name inside PLUGINS_DIR and the Elgg plugin id.
##                 For Elgg 3.x plugins whose directory is still camelCase,
##                 PLUGIN_ID is the camelCase name. For lowercase/canonical
##                 plugins, PLUGIN_ID is lowercase.
##
## Generate / refresh the .env with:
##   bin/discover-plugins.sh --root /abs/path/to/plugins --plugin <id> \
##       --write-env docker/elgg3/.env
##
## Usage:
##   PLUGIN_ID=hypeEmbed docker compose up -d --force-recreate elgg

services:
  elgg:
    volumes:
      - ${PLUGINS_DIR:?set PLUGINS_DIR in docker/elgg3/.env}/${PLUGIN_ID:?set PLUGIN_ID to the plugin under test}:/var/www/html/mod/${PLUGIN_ID}
      - ./plugin-order.txt:/var/www/html/mod/.plugin-order.txt
