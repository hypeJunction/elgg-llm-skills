services:
  elgg:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - elgg-data:/var/www/data
    environment:
      ELGG_DB_HOST: db
      ELGG_DB_NAME: elgg
      ELGG_DB_USER: elgg
      ELGG_DB_PASS: elgg
      ELGG_SITE_URL: "http://localhost:${ELGG_PORT:-8280}/"
      ELGG_DATA_ROOT: "/var/www/data/"
      ELGG_ADMIN_EMAIL: "admin@example.com"
      ELGG_ADMIN_PASSWORD: "admin12345"
    ports:
      - "${ELGG_PORT:-8280}:80"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /usr/local/bin/elgg-install.sh

  db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: elgg
      MYSQL_USER: elgg
      MYSQL_PASSWORD: elgg
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"

  # Node.js + Playwright for running Playwright and Vitest tests inside Docker.
  # Activated via --profile test so it doesn't start with `docker compose up`.
  node:
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    # SAFETY: mount ONLY the single plugin under test, matching the per-plugin
    # isolation of the elgg service. Mounting the entire ${PLUGINS_DIR} here
    # caused a fleet-wide wipe on 2026-04-13 when a destructive command inside
    # the node container propagated to every sibling plugin on the host.
    volumes:
      - ${PLUGINS_DIR:?set PLUGINS_DIR in docker/elgg2/.env}/${PLUGIN_ID:?set PLUGIN_ID to the plugin under test}:/plugins/${PLUGIN_ID}
    working_dir: /plugins/${PLUGIN_ID}
    environment:
      ELGG_BASE_URL: "http://elgg"
      ELGG_PORT: "80"
      ELGG_DB_HOST: db
      ELGG_DB_PORT: "3306"
      ELGG_DB_USER: elgg
      ELGG_DB_PASS: elgg
      ELGG_DB_NAME: elgg
    depends_on:
      - elgg
    profiles:
      - test

volumes:
  elgg-data:
  db-data:
