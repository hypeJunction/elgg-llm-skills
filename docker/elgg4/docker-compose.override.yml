## Per-plugin isolation override for the elgg4 migration test environment.
##
## Each plugin is migrated and verified in isolation. This file never bakes in
## absolute developer paths — it reads them from `.env` (gitignored) so the
## environment is portable across machines.
##
## Required variables (set in docker/elgg4/.env or the shell):
##   PLUGINS_DIR   Absolute path to the directory containing plugin sources.
##   PLUGIN_ID     Lowercase plugin id of the plugin under test. Must match
##                 the directory name inside PLUGINS_DIR and the Elgg plugin id.
##
## Usage:
##   PLUGIN_ID=hypeembed docker compose up -d --force-recreate elgg
##
## To run a plugin together with its declared dependencies, create a sibling
## docker-compose.deps.yml that adds extra volume mounts and start compose with
## `-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.deps.yml`.

services:
  elgg:
    volumes:
      - ${PLUGINS_DIR:?set PLUGINS_DIR in docker/elgg4/.env}/${PLUGIN_ID:?set PLUGIN_ID to the plugin under test}:/var/www/html/mod/${PLUGIN_ID}
      - ./plugin-order.txt:/var/www/html/mod/.plugin-order.txt
