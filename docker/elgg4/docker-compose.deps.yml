## Cross-plugin dependency override for the elgg4 migration test environment.
##
## Most migrations run against a single plugin using only docker-compose.override.yml.
## When a plugin has hard runtime dependencies on sibling hype* plugins, list them
## here as additional read-write bind mounts. Each mounted dep is scoped to its own
## subdir under /var/www/html/mod, matching the per-plugin isolation invariant —
## the rule is "one plugin under test", not "one directory mounted total".
##
## Usage:
##   docker compose \
##     -f docker/elgg4/docker-compose.yml \
##     -f docker/elgg4/docker-compose.override.yml \
##     -f docker/elgg4/docker-compose.deps.yml \
##     up -d --force-recreate elgg
##
## Invariant: every entry MUST be a per-plugin mount (${PLUGINS_DIR}/<id>:/var/www/html/mod/<id>),
## never a bare ${PLUGINS_DIR}:/var/www/html/mod (see bead elgg-migrate-c0ou for the
## 2026-04-13 fleet-wipe post-mortem).
##
## Currently configured for: hypeinbox (requires hypelists).
## hypeinbox's manifest.xml also lists hypeAutocomplete but that dependency is a
## 3.x-era manifest declaration — Elgg 4.x reads runtime deps from elgg-plugin.php
## and hypeinbox's elgg-plugin.php has no declared dependencies, so autocomplete is
## soft at activation time.

services:
  elgg:
    volumes:
      - ${PLUGINS_DIR:?set PLUGINS_DIR in docker/elgg4/.env}/hypelists:/var/www/html/mod/hypelists
