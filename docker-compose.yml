# Root-level services for the elgg-migrate toolkit itself.
# Version-specific Elgg environments live in docker/elgg{N}/.

services:
  # AST migration tool — PHP 8.1 with nikic/php-parser
  # Usage:
  #   docker compose run --rm migrate bin/migrate.php rules/3x-to-4x/manifest.json /plugins/<plugin>
  #   docker compose run --rm migrate bin/migrate.php rules/3x-to-4x/manifest.json /plugins/<plugin> --dry-run --report
  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    volumes:
      - ${PLUGINS_DIR:-./tmp}:/plugins
