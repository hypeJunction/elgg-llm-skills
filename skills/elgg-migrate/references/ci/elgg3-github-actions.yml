# Template: GitHub Actions for Elgg 3.x Plugin Tests
#
# Copy to .github/workflows/tests.yml in your plugin repo.
# Replace PLUGIN_NAME with your plugin's directory name.
#
# Adjust ELGG_VERSION, PHP_VERSION, MYSQL_VERSION as needed.

name: Plugin Tests

on:
  push:
    branches: [master, migrate/*, main]
  pull_request:

env:
  ELGG_VERSION: "3.3.25"
  PHP_VERSION: "7.4"
  MYSQL_VERSION: "5.7"
  PLUGIN_NAME: "PLUGIN_NAME"  # Change this

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: "mysql:${{ env.MYSQL_VERSION }}"
        env:
          MYSQL_DATABASE: elgg_test
          MYSQL_USER: elgg
          MYSQL_PASSWORD: elgg
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ env.PHP_VERSION }}"
          extensions: gd, intl, mysqli, pdo_mysql, xml, zip
          coverage: none

      - name: Install Elgg
        run: |
          composer create-project elgg/elgg:${{ env.ELGG_VERSION }} elgg \
            --no-interaction --prefer-dist --no-dev
          cd elgg
          cat > elgg-config/settings.php << 'SETTINGS'
          <?php
          global $CONFIG;
          if (!isset($CONFIG)) $CONFIG = new \stdClass;
          $CONFIG->dbuser = 'elgg';
          $CONFIG->dbpass = 'elgg';
          $CONFIG->dbname = 'elgg_test';
          $CONFIG->dbhost = '127.0.0.1';
          $CONFIG->dbport = '3306';
          $CONFIG->dbprefix = 'elgg_';
          $CONFIG->dbencoding = 'utf8mb4';
          $CONFIG->dataroot = '/tmp/elgg-data/';
          $CONFIG->wwwroot = 'http://localhost/';
          $CONFIG->cacheroot = '/tmp/elgg-data/cache/';
          $CONFIG->assetroot = '/tmp/elgg-data/assets/';
          SETTINGS
          mkdir -p /tmp/elgg-data
          php -r "
          require 'vendor/autoload.php';
          \$installer = new \ElggInstaller();
          \$installer->batchInstall([
              'dbuser' => 'elgg', 'dbpassword' => 'elgg',
              'dbname' => 'elgg_test', 'dbhost' => '127.0.0.1',
              'dbport' => '3306', 'dbprefix' => 'elgg_',
              'sitename' => 'CI Test', 'siteemail' => 'test@example.com',
              'wwwroot' => 'http://localhost/', 'dataroot' => '/tmp/elgg-data/',
              'displayname' => 'Admin', 'email' => 'admin@example.com',
              'username' => 'admin', 'password' => 'admin12345',
          ]);
          "

      - name: Install plugin
        run: |
          cp -r plugin "elgg/mod/${{ env.PLUGIN_NAME }}"
          cd elgg
          composer require --dev phpunit/phpunit:^8.0 --no-interaction

      - name: Activate plugin
        run: |
          cd elgg
          php -r "
          require 'vendor/autoload.php';
          \$app = \Elgg\Application::getInstance();
          \$app->bootCore();
          _elgg_services()->plugins->generateEntities();
          \$plugin = elgg_get_plugin_from_id('${{ env.PLUGIN_NAME }}');
          if (\$plugin) { \$plugin->activate(); echo 'OK'; }
          else { echo 'FAIL: plugin not found'; exit(1); }
          "

      - name: Run tests
        run: |
          cd elgg
          php vendor/bin/phpunit \
            --configuration "mod/${{ env.PLUGIN_NAME }}/tests/phpunit.xml"
