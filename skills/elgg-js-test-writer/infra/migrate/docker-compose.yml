# AST migration tool — runs bin/migrate.php against a plugin tree
# mounted at /plugins. Part of the elgg-migrate skill; the build
# context is the skill root so the Dockerfile can COPY composer.json,
# src/, bin/, and rules/ directly.
#
# Usage (from inside this directory, or with -f pointing here):
#   PLUGINS_DIR=/abs/path docker compose run --rm migrate \
#     bin/migrate.php rules/3x-to-4x/manifest.json /plugins/<plugin>
#   PLUGINS_DIR=/abs/path docker compose run --rm migrate \
#     bin/migrate.php rules/3x-to-4x/manifest.json /plugins/<plugin> --dry-run --report

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/migrate/Dockerfile
    volumes:
      - ${PLUGINS_DIR:?PLUGINS_DIR must be set to the absolute path of the plugin tree to migrate}:/plugins
