# Per-plugin test environment for Elgg 4.x.
#
# Lives at <plugin>/docker/docker-compose.yml and is self-contained:
# it never references any other plugin, never mounts a shared plugin
# workspace, and does not depend on the elgg-migrate skill.
#
# Run all commands from <plugin>/ (the parent of this directory):
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml exec elgg bash
#   docker compose -f docker/docker-compose.yml --profile test run --rm node \
#     sh -c "cd /plugin/tests/playwright && npm ci && npx playwright test"
#
# Required environment (see docker/.env.example):
#   PLUGIN_ID   lowercase Elgg plugin id (matches composer.json "name")
#
# Optional:
#   ELGG_PORT   host port for Apache (default 8480)
#   DB_PORT     host port for MySQL (default 3307)

services:
  elgg:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - elgg-data:/var/www/data
      # Plugin source is mounted read-write so composer install / test
      # artifacts written inside the container land back in the repo.
      - ..:/var/www/html/mod/${PLUGIN_ID:?set PLUGIN_ID in docker/.env}
    environment:
      PLUGIN_ID: ${PLUGIN_ID}
      ELGG_DB_HOST: db
      ELGG_DB_NAME: elgg
      ELGG_DB_USER: elgg
      ELGG_DB_PASS: elgg
      ELGG_SITE_URL: "http://localhost:${ELGG_PORT:-8480}/"
      ELGG_DATA_ROOT: "/var/www/data/"
      ELGG_ADMIN_EMAIL: "admin@example.com"
      ELGG_ADMIN_PASSWORD: "admin12345"
    ports:
      - "${ELGG_PORT:-8480}:80"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /usr/local/bin/elgg-install.sh

  db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: elgg
      MYSQL_USER: elgg
      MYSQL_PASSWORD: elgg
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"

  # Node.js + Playwright, activated via --profile test so it does not
  # start with `docker compose up`. Mounts ONLY this plugin's source at
  # /plugin — never a parent workspace — so a destructive command inside
  # the container cannot touch sibling plugins.
  node:
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    volumes:
      - ..:/plugin
    working_dir: /plugin
    environment:
      PLUGIN_ID: ${PLUGIN_ID}
      ELGG_BASE_URL: "http://elgg"
      ELGG_PORT: "80"
      ELGG_DB_HOST: db
      ELGG_DB_PORT: "3306"
      ELGG_DB_USER: elgg
      ELGG_DB_PASS: elgg
      ELGG_DB_NAME: elgg
    depends_on:
      - elgg
    profiles:
      - test

volumes:
  elgg-data:
  db-data:
